<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>ماين ستريم | Mainstream</title>
    <!-- عند الإطلاق: استبدل NEW_DOMAIN بالدومين النهائي، ثم انشر هذا الملف كـ index.html و 404.html على فرع gh-pages. -->
    <link rel="canonical" href="https://NEW_DOMAIN/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://NEW_DOMAIN/" />
    <script>
      // يحافظ على المسار: /BILAL/services/web → https://NEW_DOMAIN/services/web
      location.replace("https://NEW_DOMAIN" + location.pathname.replace(/^\/BILAL(\/v[12])?/, "") + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>انتقل الموقع إلى <a href="https://NEW_DOMAIN/">https://NEW_DOMAIN/</a></p>
  </body>
</html>
